document.getElementById('pages').innerHTML=pages;
function go(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));(document.getElementById(id)||document.getElementById('dashboard')).classList.add('active');document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.p===id));document.getElementById('side').classList.remove('open');scrollTo(0,0)}
function side(){document.getElementById('side').classList.toggle('open')}
function toast(m){let t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>t.style.display='none',2200)}
function openM(title){document.getElementById('mt').textContent=title;document.getElementById('mb').innerHTML=`<p class="mini">This is a working local prototype action. In production, this flow will connect to the Multiflow backend, database and relevant provider/gateway.</p><div class="actions"><button class="btn" onclick="closeM()">Cancel</button><button class="btn primary" onclick="closeM();toast('Action completed')">Continue</button></div>`;document.getElementById('modal').style.display='flex'}
function closeM(){document.getElementById('modal').style.display='none'}
function create(){openM('Create');}
function detail(x){openM(x+' · Details')}
function filter(i){let q=i.value.toLowerCase(),table=i.closest('.section').querySelector('table');table.querySelectorAll('tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')}
go('dashboard');
</script></body></html>
